[project]
name = "whisper-workbench"
dynamic = ["version"]
description = "Turn meeting recordings into a corrected, readable transcript document"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wb = "whisper_workbench.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# The repo carries legacy date-based tags (release-2026-03-11, ...) that would
# otherwise be parsed as versions. Only vX.Y.Z tags count.
[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_workbench"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
